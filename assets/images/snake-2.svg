<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600" role="img" aria-label="贪吃蛇开始菜单界面">
  <defs>
    <linearGradient id="bezel2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="snakeG2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="1" stop-color="#1Fae6b"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="288" height="588" rx="42" fill="url(#bezel2)" stroke="#3a3a45" stroke-width="2"/>
  <rect x="120" y="20" width="60" height="10" rx="5" fill="#000"/>
  <rect x="18" y="44" width="264" height="512" rx="26" fill="#0d1117"/>
  <clipPath id="scr2"><rect x="18" y="44" width="264" height="512" rx="26"/></clipPath>

  <g clip-path="url(#scr2)">
    <text x="150" y="180" text-anchor="middle" fill="#e6edf3" font-family="sans-serif" font-size="34" font-weight="bold">贪吃蛇</text>
    <text x="150" y="210" text-anchor="middle" fill="#9fb3c8" font-family="sans-serif" font-size="13">SNAKE · 经典重制</text>

    <!-- 装饰蛇 -->
    <g fill="url(#snakeG2)">
      <rect x="96" y="250" width="18" height="18" rx="5"/>
      <rect x="116" y="250" width="18" height="18" rx="5"/>
      <rect x="136" y="250" width="18" height="18" rx="5"/>
      <rect x="156" y="250" width="18" height="18" rx="5"/>
      <rect x="176" y="250" width="18" height="18" rx="5"/>
    </g>
    <circle cx="206" cy="259" r="8" fill="#ff5d5d"/>

    <!-- 开始按钮 -->
    <rect x="84" y="330" width="132" height="48" rx="24" fill="#1Fae6b"/>
    <text x="150" y="360" text-anchor="middle" fill="#06231a" font-family="sans-serif" font-size="18" font-weight="bold">开始游戏</text>

    <text x="150" y="420" text-anchor="middle" fill="#586677" font-family="sans-serif" font-size="12">滑动或方向键操控</text>
    <text x="150" y="442" text-anchor="middle" fill="#586677" font-family="sans-serif" font-size="12">离线畅玩 · 自动存档</text>
  </g>
</svg>
