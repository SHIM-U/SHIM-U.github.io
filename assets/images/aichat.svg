<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="AI Chat Hub 对话界面示意">
  <defs>
    <linearGradient id="hubG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a8bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="hubU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1Fae6b"/>
      <stop offset="1" stop-color="#12b886"/>
    </linearGradient>
  </defs>

  <!-- 窗口 -->
  <rect x="0" y="0" width="600" height="420" rx="18" fill="#0f1320"/>
  <rect x="0" y="0" width="600" height="420" rx="18" fill="none" stroke="#222a3d" stroke-width="2"/>
  <!-- 标题栏 -->
  <rect x="0" y="0" width="600" height="40" rx="18" fill="#161b2c"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="6" fill="#febc2e"/>
  <circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="300" y="25" text-anchor="middle" fill="#8b93a7" font-family="sans-serif" font-size="13">AI Chat Hub</text>

  <!-- 侧边栏：模型列表 -->
  <rect x="0" y="40" width="150" height="380" fill="#121726"/>
  <g font-family="sans-serif">
    <text x="18" y="70" fill="#8b93a7" font-size="12">模型</text>
    <rect x="14" y="82" width="122" height="30" rx="8" fill="url(#hubG)"/>
    <text x="26" y="102" fill="#ffffff" font-size="13" font-weight="bold">GPT 类</text>
    <rect x="14" y="120" width="122" height="30" rx="8" fill="#1c2334"/>
    <text x="26" y="140" fill="#cdd3e0" font-size="13">Claude 类</text>
    <rect x="14" y="158" width="122" height="30" rx="8" fill="#1c2334"/>
    <text x="26" y="178" fill="#cdd3e0" font-size="13">Gemini 类</text>
    <rect x="14" y="196" width="122" height="30" rx="8" fill="#1c2334"/>
    <text x="26" y="216" fill="#cdd3e0" font-size="13">本地模型</text>
  </g>

  <!-- 对话区 -->
  <g font-family="sans-serif">
    <!-- 用户气泡 -->
    <rect x="360" y="70" width="216" height="46" rx="14" fill="url(#hubU)"/>
    <text x="376" y="98" fill="#04231a" font-size="13">帮我写一段主题切换代码</text>
    <!-- AI 气泡 -->
    <rect x="170" y="140" width="330" height="96" rx="14" fill="#1c2334"/>
    <text x="186" y="166" fill="#cdd3e0" font-size="13">当然！用 CSS 变量 +</text>
    <text x="186" y="188" fill="#cdd3e0" font-size="13">data-theme 即可平滑切换，</text>
    <text x="186" y="210" fill="#cdd3e0" font-size="13">配合 View Transitions 更丝滑。</text>
    <!-- 输入栏 -->
    <rect x="170" y="330" width="406" height="44" rx="14" fill="#1c2334"/>
    <text x="188" y="358" fill="#6b7280" font-size="13">输入消息…</text>
    <rect x="500" y="338" width="60" height="28" rx="14" fill="url(#hubG)"/>
    <text x="530" y="357" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">发送</text>
  </g>
</svg>
