<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-label="AI Chat Hub 对话界面示意">
  <defs>
    <linearGradient id="hubG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a8bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="hubU" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fae6b"/>
      <stop offset="1" stop-color="#12b886"/>
    </linearGradient>
    <linearGradient id="hubBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1320"/>
      <stop offset="1" stop-color="#0a0d17"/>
    </linearGradient>
  </defs>

  <!-- 窗口 -->
  <rect x="0" y="0" width="760" height="480" rx="20" fill="url(#hubBg)"/>
  <rect x="0.5" y="0.5" width="759" height="479" rx="20" fill="none" stroke="#222a3d" stroke-width="1"/>

  <!-- 标题栏 -->
  <rect x="0" y="0" width="760" height="46" rx="20" fill="#161b2c"/>
  <rect x="0" y="26" width="760" height="20" fill="#161b2c"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="23" r="6" fill="#febc2e"/>
  <circle cx="70" cy="23" r="6" fill="#28c840"/>
  <text x="380" y="28" text-anchor="middle" fill="#8b93a7" font-family="sans-serif" font-size="14">AI Chat Hub · 多模型对话中心</text>

  <!-- 侧边栏：模型列表 -->
  <rect x="0" y="46" width="196" height="434" fill="#121726"/>
  <rect x="195" y="46" width="1" height="434" fill="#222a3d"/>
  <g font-family="sans-serif">
    <text x="20" y="80" fill="#8b93a7" font-size="13">选择模型</text>

    <rect x="14" y="94" width="168" height="40" rx="10" fill="url(#hubG)"/>
    <circle cx="34" cy="114" r="6" fill="#ffffff"/>
    <text x="50" y="119" fill="#ffffff" font-size="14" font-weight="bold">GPT 类</text>

    <rect x="14" y="142" width="168" height="40" rx="10" fill="#1c2334"/>
    <circle cx="34" cy="162" r="6" fill="#6a8bff"/>
    <text x="50" y="167" fill="#cdd3e0" font-size="14">Claude 类</text>

    <rect x="14" y="190" width="168" height="40" rx="10" fill="#1c2334"/>
    <circle cx="34" cy="210" r="6" fill="#9b5cff"/>
    <text x="50" y="215" fill="#cdd3e0" font-size="14">Gemini 类</text>

    <rect x="14" y="238" width="168" height="40" rx="10" fill="#1c2334"/>
    <circle cx="34" cy="258" r="6" fill="#12b886"/>
    <text x="50" y="263" fill="#cdd3e0" font-size="14">本地模型</text>

    <rect x="14" y="420" width="168" height="40" rx="10" fill="#1c2334"/>
    <text x="30" y="445" fill="#6b7280" font-family="sans-serif" font-size="13">+ 新建会话</text>
  </g>

  <!-- 对话区 -->
  <g font-family="sans-serif">
    <!-- 用户气泡 -->
    <rect x="430" y="78" width="300" height="52" rx="16" fill="url(#hubU)"/>
    <text x="450" y="110" fill="#04231a" font-size="14">用 Python 帮我写个快速排序</text>

    <!-- AI 气泡 -->
    <rect x="216" y="150" width="470" height="150" rx="16" fill="#1c2334"/>
    <text x="238" y="182" fill="#cdd3e0" font-size="14">当然！快速排序核心是分治：选基准，</text>
    <text x="238" y="208" fill="#cdd3e0" font-size="14">将比它小的放左、大的放右，再递归。</text>
    <text x="238" y="234" fill="#cdd3e0" font-size="14">平均时间复杂度 O(n·log n)，是工程里</text>
    <text x="238" y="260" fill="#cdd3e0" font-size="14">最常用的排序之一。要我贴完整代码吗？</text>
    <text x="238" y="288" fill="#6a8bff" font-size="13">▍ 正在流式输出…</text>

    <!-- 输入栏 -->
    <rect x="216" y="330" width="470" height="52" rx="16" fill="#1c2334"/>
    <text x="238" y="362" fill="#6b7280" font-size="14">输入消息，回车发送…</text>
    <rect x="600" y="340" width="72" height="32" rx="16" fill="url(#hubG)"/>
    <text x="636" y="361" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">发送</text>

    <!-- 提示：多模型并行 -->
    <text x="216" y="412" fill="#8b93a7" font-family="sans-serif" font-size="13">⚡ 多模型并行 · 流式响应 · 免登录即用</text>
  </g>
</svg>
