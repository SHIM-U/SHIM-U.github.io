<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="贪吃蛇结算与排行榜界面">
  <defs>
    <linearGradient id="snakeG3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="1" stop-color="#1Fae6b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="600" height="340" rx="20" fill="#0d1117"/>
  <rect x="0" y="0" width="600" height="340" rx="20" fill="none" stroke="#1c2733" stroke-width="2"/>

  <text x="40" y="64" fill="#e6edf3" font-family="sans-serif" font-size="26" font-weight="bold">本局结算</text>
  <text x="40" y="92" fill="#9fb3c8" font-family="monospace" font-size="14">得分 128 · 长度 24 · 用时 1:42</text>

  <!-- 排行榜 -->
  <g font-family="sans-serif">
    <text x="360" y="56" fill="#9fb3c8" font-size="14">本地排行榜</text>

    <g transform="translate(360,72)">
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#11202b" stroke="#1Fae6b" stroke-width="1.5"/>
      <text x="16" y="26" fill="#7CFFB2" font-size="16" font-weight="bold">1</text>
      <text x="44" y="26" fill="#e6edf3" font-size="15">八哥</text>
      <text x="184" y="26" text-anchor="end" fill="#e6edf3" font-size="15" font-weight="bold">512</text>
    </g>
    <g transform="translate(360,120)">
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#11202b"/>
      <text x="16" y="26" fill="#9fb3c8" font-size="16" font-weight="bold">2</text>
      <text x="44" y="26" fill="#e6edf3" font-size="15">小鱼</text>
      <text x="184" y="26" text-anchor="end" fill="#e6edf3" font-size="15" font-weight="bold">430</text>
    </g>
    <g transform="translate(360,168)">
      <rect x="0" y="0" width="200" height="40" rx="10" fill="#11202b"/>
      <text x="16" y="26" fill="#9fb3c8" font-size="16" font-weight="bold">3</text>
      <text x="44" y="26" fill="#e6edf3" font-size="15">阿强</text>
      <text x="184" y="26" text-anchor="end" fill="#e6edf3" font-size="15" font-weight="bold">387</text>
    </g>
  </g>

  <!-- 左侧装饰蛇 -->
  <g fill="url(#snakeG3)" transform="translate(40,150)">
    <rect x="0" y="0" width="22" height="22" rx="6"/>
    <rect x="26" y="0" width="22" height="22" rx="6"/>
    <rect x="52" y="0" width="22" height="22" rx="6"/>
    <rect x="78" y="0" width="22" height="22" rx="6"/>
    <rect x="78" y="26" width="22" height="22" rx="6"/>
    <rect x="78" y="52" width="22" height="22" rx="6"/>
    <rect x="52" y="52" width="22" height="22" rx="6"/>
  </g>
  <circle cx="172" cy="206" r="10" fill="#ff5d5d"/>
</svg>
