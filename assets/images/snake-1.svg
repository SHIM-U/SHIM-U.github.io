<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 600" width="300" height="600" role="img" aria-label="贪吃蛇游戏进行中界面">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a33"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c2733" stroke-width="1"/>
    </pattern>
    <linearGradient id="snakeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFFB2"/>
      <stop offset="1" stop-color="#1Fae6b"/>
    </linearGradient>
  </defs>

  <!-- 手机外壳 -->
  <rect x="6" y="6" width="288" height="588" rx="42" fill="url(#bezel)" stroke="#3a3a45" stroke-width="2"/>
  <rect x="120" y="20" width="60" height="10" rx="5" fill="#000"/>

  <!-- 屏幕 -->
  <rect x="18" y="44" width="264" height="512" rx="26" fill="#0d1117"/>
  <clipPath id="scr"><rect x="18" y="44" width="264" height="512" rx="26"/></clipPath>
  <g clip-path="url(#scr)">
    <rect x="18" y="44" width="264" height="512" fill="url(#grid)"/>
    <!-- HUD -->
    <text x="34" y="78" fill="#9fb3c8" font-family="monospace" font-size="14">分数</text>
    <text x="34" y="98" fill="#e6edf3" font-family="monospace" font-size="20" font-weight="bold">128</text>
    <text x="266" y="78" text-anchor="end" fill="#9fb3c8" font-family="monospace" font-size="14">最高</text>
    <text x="266" y="98" text-anchor="end" fill="#e6edf3" font-family="monospace" font-size="20" font-weight="bold">512</text>

    <!-- 食物 -->
    <circle cx="210" cy="300" r="9" fill="#ff5d5d"/>
    <circle cx="207" cy="297" r="3" fill="#ffd0d0"/>

    <!-- 蛇身 -->
    <g fill="url(#snakeG)">
      <rect x="66" y="180" width="20" height="20" rx="6"/>
      <rect x="90" y="180" width="20" height="20" rx="6"/>
      <rect x="114" y="180" width="20" height="20" rx="6"/>
      <rect x="138" y="180" width="20" height="20" rx="6"/>
      <rect x="138" y="204" width="20" height="20" rx="6"/>
      <rect x="138" y="228" width="20" height="20" rx="6"/>
      <rect x="162" y="228" width="20" height="20" rx="6"/>
      <rect x="186" y="228" width="20" height="20" rx="6"/>
      <rect x="186" y="252" width="20" height="20" rx="6"/>
    </g>
    <!-- 蛇头 -->
    <rect x="186" y="276" width="20" height="20" rx="6" fill="#9dffc4"/>
    <circle cx="193" cy="283" r="2.4" fill="#0d1117"/>
    <circle cx="199" cy="283" r="2.4" fill="#0d1117"/>
  </g>
</svg>
